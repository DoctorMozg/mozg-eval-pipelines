name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - run: uv run --frozen pytest
