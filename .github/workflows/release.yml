name: release

on:
  push:
    tags: ["v*"]
  # A manual run builds and checks every binary but publishes nothing.
  workflow_dispatch:

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build
        shell: bash
        run: scripts/build-pyapp.sh "${{ matrix.target }}" dist
      - name: Runs offline with no Python (Linux)
        if: runner.os == 'Linux'
        run: >
          docker run --rm --network none -v "$PWD/dist:/d:ro" debian:bookworm-slim
          sh -c '! command -v python3 && /d/mzeval-*-x86_64-unknown-linux-gnu --version'
      - name: Runs (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary=(dist/mzeval-*-"$TARGET"*)
          "${binary[0]}" --version
      - uses: actions/upload-artifact@v7
        with:
          name: mzeval-${{ matrix.target }}
          path: dist/mzeval-*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
