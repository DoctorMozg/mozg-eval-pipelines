schema: mzeval/2
name: debug-gate-diagnosis
description: The debug skill writes a failing regression test before it touches the code.
kind: gate
tags: [behaviour]
bundle: [../../plugins/mz-dev-pipe, ../../plugins/mz-base]
fixture: fixture.sh
execution:
  prompt: The discount in pricing.py is applied twice for repeat customers. Debug it.
  tools: [skill, subagent, read, write, edit, glob, grep, shell]
  max_turns: 30
  timeout_s: 900
  runs: 3
graders:
  - name: debug-fires
    type: skill
    skill: debug
  - name: test-before-fix
    type: tool_order
    sequence:
      - { kind: write, match: 'tests/test_pricing\.py' }
      - { kind: edit, match: 'pricing\.py' }
  - name: regression-test-added
    type: regex
    pattern: 'def test_'
    target: { file: tests/test_pricing.py }
    min: 2
    max: 2
  - name: no-edit-outside-workspace
    type: tool_called
    kind: edit
    path_match: '^/(?!tmp/)'
    max: 0
    min: 0
  - name: tests-pass
    type: command
    run: python -m pytest -q tests
    timeout_s: 120
