schema: mzeval/2
name: render-near-miss
description: Checking a finished render belongs to resolve-verify, not resolve-render.
kind: near-miss
tags: [routing, negative]
expect:
  skill: { not: resolve-render, owner: resolve-verify }
bundle: [../../plugins/davinci-resolve, ../../plugins/dramaturgy]
execution:
  prompt: The render finished. Did it actually work? Check the file before I upload it.
  tools: [skill]
  max_turns: 8
  timeout_s: 240
graders:
  - name: mentions-ffprobe
    type: judge
    checklist:
      - Says the file must be checked with ffprobe before upload
drivers: { exclude: [pi] }
