[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "mozg-eval"
version = "0.1.0"
description = "Vendor-neutral evals for coding-agent plugins and skills"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20.1,<2",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.14,<3",
  "pydantic-ai-slim[anthropic,openai,openrouter]==2.68.0",
  "pyyaml>=6.0.3,<7",
  "sqlalchemy>=2.1.8,<3",
  "typer>=0.29,<0.30",
]

[project.scripts]
mzeval = "mozg_eval.cli:app"

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pre-commit>=4.7,<5",
  "pytest>=9.2,<10",
  "ruff>=0.17,<0.18",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mozg_eval"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
