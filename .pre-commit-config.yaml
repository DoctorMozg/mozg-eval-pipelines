# Vendored builds stay byte-identical to upstream.
exclude: ^src/mozg_eval/report/static/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        # Keep 1, 2, 3 numbering: milestones and questions are referred to by number.
        args: [--number]
        additional_dependencies:
          - mdformat-gfm
          - mdformat-tables
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      # Runs in the project env so mypy sees the real dependency versions from uv.lock.
      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
